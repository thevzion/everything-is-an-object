<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" width="1200" height="456" role="img" aria-labelledby="t d">
  <title id="t">Make it explicit: a signal becomes an object</title>
  <desc id="d">Animated. Sam says: open on Saturdays from March, Lea agrees. The materializer looks for an existing object and finds the goal, picks a type, decision, and keeps the words as said. A decision object appears, line by line: its type, model, what it serves, its source, its date, and Sam's words. A link draws to the goal. A commit records the change with its why, and the assistant answers what was written.</desc>
  <defs>
    <style>
      .sans{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif}
      .mono{font-family:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .box{fill:#fbfaf6;stroke:#d8d2c4;stroke-width:1.2}
      .kick{font-size:11px;letter-spacing:1.6px}
      .hk{font-size:13px;fill:#6f6a60}
      .hv{font-size:13px;fill:#1a1814}
      @media (prefers-reduced-motion: no-preference){
      .s{animation-duration:11s;animation-iteration-count:infinite;animation-timing-function:ease-out}
      .a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}.a4{animation-name:a4}
      .a5{animation-name:a5}.a6{animation-name:a6}.a7{animation-name:a7}.a8{animation-name:a8}
      .a9{animation-name:a9}.a10{animation-name:a10}.a11{animation-name:a11}.a12{animation-name:a12}
      .a13{animation-name:a13}
      .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 11s infinite ease-out}
      }
      @keyframes a1{0%,2%{opacity:0}6%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a2{0%,13%{opacity:0}17%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a3{0%,19%{opacity:0}23%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a4{0%,25%{opacity:0}29%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a5{0%,31%{opacity:0}34%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a6{0%,35%{opacity:0}37%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a7{0%,38%{opacity:0}40%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a8{0%,41%{opacity:0}43%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a9{0%,44%{opacity:0}46%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a10{0%,48%{opacity:0}52%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a11{0%,55%{opacity:0}59%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a12{0%,63%{opacity:0}67%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes a13{0%,71%{opacity:0}75%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes draw{0%,55%{stroke-dashoffset:120;opacity:1}60%,94%{stroke-dashoffset:0;opacity:1}99%,100%{stroke-dashoffset:0;opacity:0}}
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d1a30" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a1814"/>
    </marker>
  </defs>

  <rect width="1200" height="456" rx="24" fill="#f6f3ec" stroke="#d8d2c4" stroke-width="1"/>
  <text x="60" y="40" class="mono kick" fill="#1a1814">MAKE IT EXPLICIT</text>
  <text x="1140" y="40" class="mono" font-size="11" fill="#8c8577" text-anchor="end">section 3 of every AGENTS.md</text>

  <!-- the signal -->
  <g class="s a1">
    <text x="60" y="84" class="mono kick" fill="#4a453c">A SIGNAL · WHAT SAM SAID</text>
    <rect x="60" y="98" width="300" height="78" rx="16" class="box"/>
    <text x="80" y="130" class="sans" font-size="16" fill="#1a1814">Let's open on Saturdays</text>
    <text x="80" y="154" class="sans" font-size="16" fill="#1a1814">from March. Lea agrees.</text>
  </g>

  <!-- discern -->
  <text x="60" y="222" class="mono kick s a2" fill="#1a1814">THE MATERIALIZER DISCERNS</text>
  <g class="s a2">
    <circle cx="72" cy="250" r="4" fill="#1a1814"/>
    <text x="86" y="255" class="sans" font-size="15" fill="#4a453c">An existing object?</text>
    <text x="246" y="255" class="sans" font-size="15" fill="#1a1814">the goal, fifty a month</text>
  </g>
  <g class="s a3">
    <circle cx="72" cy="282" r="4" fill="#1a1814"/>
    <text x="86" y="287" class="sans" font-size="15" fill="#4a453c">A type?</text>
    <text x="246" y="287" class="sans" font-size="15" fill="#1a1814">decision, from loop@0.1</text>
  </g>
  <g class="s a4">
    <circle cx="72" cy="314" r="4" fill="#1a1814"/>
    <text x="86" y="319" class="sans" font-size="15" fill="#4a453c">The words?</text>
    <text x="246" y="319" class="sans" font-size="15" fill="#1a1814">kept as said</text>
  </g>
  <line x1="440" y1="214" x2="500" y2="214" stroke="#1a1814" stroke-width="1.6" marker-end="url(#arrow)" class="s a5"/>

  <!-- the object -->
  <g class="s a5">
    <rect x="520" y="70" width="446" height="290" rx="16" fill="#fbfaf6" stroke="#1a1814" stroke-width="1.4"/>
    <text x="544" y="98" class="mono kick" fill="#1a1814">AN OBJECT · objects/decisions/saturdays.md</text>
    <text x="544" y="130" class="mono hk">---</text>
    <text x="544" y="152" class="mono hk">type: <tspan fill="#1a1814">decision</tspan></text>
    <text x="544" y="174" class="mono hk" font-size="12">question: <tspan class="hv" font-size="12">What did we choose, why, and who answers for it?</tspan></text>
  </g>
  <text x="544" y="196" class="mono hk s a6">model: <tspan class="hv">loop@0.1</tspan></text>
  <text x="544" y="218" class="mono hk s a7">serves: <tspan class="hv">objects/goals/fifty.md</tspan></text>
  <text x="544" y="240" class="mono hk s a8">source: <tspan class="hv">from-me</tspan></text>
  <g class="s a9">
    <text x="544" y="262" class="mono hk">date: <tspan class="hv">2026-11-18</tspan></text>
    <text x="544" y="284" class="mono hk">---</text>
  </g>
  <g class="s a10">
    <text x="544" y="316" class="sans" font-size="16" fill="#1a1814">Let's open on Saturdays from March.</text>
    <text x="544" y="340" class="sans" font-size="16" fill="#1a1814">Lea agrees.</text>
  </g>

  <!-- the link -->
  <g class="s a11"><path d="M966 218H1010" fill="none" stroke="#8c8577" stroke-width="1.6" class="draw" marker-end="url(#arrow)"/></g>
  <g class="s a11">
    <text x="988" y="208" class="mono" font-size="10" fill="#6f6a60" text-anchor="middle">serves</text>
    <rect x="1016" y="190" width="140" height="56" rx="12" fill="#fbfaf6" stroke="#1a1814" stroke-width="1.4"/>
    <text x="1030" y="210" class="mono kick" fill="#1a1814">GOAL</text>
    <text x="1030" y="232" class="sans" font-size="14" fill="#1a1814">Fifty a month</text>
  </g>

  <!-- the change -->
  <g class="s a12">
    <rect x="520" y="378" width="636" height="36" rx="10" fill="#fbfaf6" stroke="#1a1814" stroke-opacity=".5"/>
    <circle cx="540" cy="396" r="4" fill="#1a1814"/>
    <text x="554" y="401" class="mono" font-size="12" fill="#1a1814">decision(add): open on Saturdays · Why: Sam said so · Source: from-me</text>
  </g>

  <!-- the answer -->
  <g class="s a13">
    <rect x="60" y="378" width="400" height="36" rx="18" fill="#fbfaf6" stroke="#1a1814" stroke-opacity=".6"/>
    <text x="80" y="401" class="sans" font-size="14" fill="#1a1814">Written: a decision, linked to the goal.</text>
  </g>
  <text x="60" y="440" class="mono" font-size="11" fill="#8c8577">the assistant answers what was written</text>
</svg>
