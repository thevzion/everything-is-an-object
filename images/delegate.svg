<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Delegate: units start, multiply and fold</title>
  <desc id="d">Animated. Signals arrive. The assistant answers at once and gives each piece to a unit with its role: a materializer keeps what was said, a maker makes the page, a checker that did not make it checks it, and its fixes go back to the maker. When more signals arrive, the materializer starts other units of itself; when the load drops, they fold. Every unit reads the same AGENTS.md, and hands back objects.</desc>
  <defs>
    <style>
      .sans{font-family:Saira,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
      .sig{fill:#0a1426;stroke:#26385a;stroke-width:1.2}
      .sigt{font-size:13.5px;fill:#eaf1fb}
      .unit{fill:#0a1426;stroke:#1d2c47;stroke-width:1.2}
      .kick{font-size:10.5px;letter-spacing:1.4px}
      .ut{font-size:13.5px;fill:#eaf1fb}
      .wire{stroke:#25bcdd;stroke-width:1.5;fill:none}
      .lbl{font-size:10px;fill:#8195b3}
      .chip{fill:#0d1b33;stroke:#1d2c47;stroke-width:1}
      .chipt{font-size:12px;fill:#a3b3ca}
      .b16{opacity:0}
      @media (prefers-reduced-motion: no-preference){
      .s{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-out}
      .b1{animation-name:b1}.b2{animation-name:b2}.b3{animation-name:b3}.b4{animation-name:b4}
      .b5{animation-name:b5}.b6{animation-name:b6}.b7{animation-name:b7}.b8{animation-name:b8}
      .b9{animation-name:b9}.b10{animation-name:b10}.b11{animation-name:b11}.b12{animation-name:b12}
      .b13{animation-name:b13}.b14{animation-name:b14}.b15{animation-name:b15}.b16{animation-name:b16}
      }
      @keyframes b1{0%,2%{opacity:0}5%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b2{0%,9%{opacity:0}12%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b3{0%,17%{opacity:0}20%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b4{0%,21%{opacity:0}24%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b5{0%,27%{opacity:0}30%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b6{0%,37%{opacity:0}40%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b7{0%,45%{opacity:0}48%,82%{opacity:1}87%,100%{opacity:0}}
      @keyframes b8{0%,48%{opacity:0}51%,82%{opacity:1}87%,100%{opacity:0}}
      @keyframes b9{0%,51%{opacity:0}54%,82%{opacity:1}87%,100%{opacity:0}}
      @keyframes b10{0%,54%{opacity:0}57%,82%{opacity:1}87%,100%{opacity:0}}
      @keyframes b11{0%,59%{opacity:0}62%,82%{opacity:1}87%,100%{opacity:0}}
      @keyframes b12{0%,63%{opacity:0}66%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b13{0%,67%{opacity:0}70%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b14{0%,69%{opacity:0}72%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b15{0%,75%{opacity:0}78%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes b16{0%,86%{opacity:0}89%,95%{opacity:1}99%,100%{opacity:0}}
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d1a30" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#25bcdd"/>
    </marker>
  </defs>

  <rect width="1200" height="470" rx="24" fill="#060d1a"/>
  <rect width="1200" height="470" rx="24" fill="url(#grid)"/>
  <text x="60" y="40" class="mono" font-size="11" letter-spacing="1.6" fill="#7fd3ff">DELEGATE</text>
  <text x="1140" y="40" class="mono" font-size="11" fill="#5d7090" text-anchor="end">section 5 of every AGENTS.md</text>

  <!-- signals -->
  <text x="60" y="70" class="mono kick" fill="#a3b3ca">SIGNALS</text>
  <g class="s b1"><rect x="60" y="82" width="250" height="34" rx="17" class="sig"/><text x="78" y="104" class="sans sigt">Open on Saturdays from March</text></g>
  <g class="s b4"><rect x="60" y="126" width="250" height="34" rx="17" class="sig"/><text x="78" y="148" class="sans sigt">Make a page for the workshop</text></g>
  <g class="s b7"><rect x="60" y="170" width="250" height="34" rx="17" class="sig"/><text x="78" y="192" class="sans sigt">Lea joins the Saturday shift</text></g>
  <g class="s b8"><rect x="60" y="214" width="250" height="34" rx="17" class="sig"/><text x="78" y="236" class="sans sigt">Order brake pads</text></g>
  <g class="s b9"><rect x="60" y="258" width="250" height="34" rx="17" class="sig"/><text x="78" y="280" class="sans sigt">Fifty repairs: where are we?</text></g>
  <line x1="318" y1="190" x2="354" y2="190" class="wire" marker-end="url(#arrow)"/>

  <!-- the assistant, always there -->
  <rect x="360" y="146" width="210" height="88" rx="14" fill="#0b1a33" stroke="#7fd3ff" stroke-width="1.4"/>
  <text x="378" y="170" class="mono kick" fill="#7fd3ff">UNIT · THE ASSISTANT</text>
  <text x="378" y="194" class="sans ut">answers at once,</text>
  <text x="378" y="214" class="sans ut">gives each unit its role</text>

  <!-- materializer, and the units it starts under load -->
  <g class="s b2">
    <path d="M570 172C600 172 610 110 640 110" class="wire" marker-end="url(#arrow)"/>
    <text x="598" y="128" class="mono lbl">brief</text>
    <rect x="640" y="82" width="150" height="56" rx="12" class="unit"/>
    <text x="654" y="102" class="mono kick" fill="#a3b3ca">MATERIALIZER</text>
    <text x="654" y="124" class="sans ut">keeps what was said</text>
  </g>
  <g class="s b10">
    <line x1="790" y1="110" x2="814" y2="110" class="wire" marker-end="url(#arrow)"/>
    <rect x="818" y="82" width="150" height="56" rx="12" class="unit" stroke-dasharray="5 4"/>
    <text x="832" y="102" class="mono kick" fill="#a3b3ca">MATERIALIZER</text>
    <text x="832" y="124" class="sans ut">another of itself</text>
  </g>
  <g class="s b11">
    <line x1="968" y1="110" x2="992" y2="110" class="wire" marker-end="url(#arrow)"/>
    <rect x="996" y="82" width="150" height="56" rx="12" class="unit" stroke-dasharray="5 4"/>
    <text x="1010" y="102" class="mono kick" fill="#a3b3ca">MATERIALIZER</text>
    <text x="1010" y="124" class="sans ut">another of itself</text>
  </g>
  <text x="818" y="72" class="mono lbl s b10">the load grows: the role starts more of itself</text>
  <text x="818" y="72" class="mono lbl s b16" fill="#7fd3ff">the load drops: they fold</text>

  <!-- maker and checker -->
  <g class="s b5">
    <path d="M570 208C600 208 610 194 640 194" class="wire" marker-end="url(#arrow)"/>
    <text x="598" y="190" class="mono lbl">brief</text>
    <rect x="640" y="166" width="150" height="56" rx="12" class="unit"/>
    <text x="654" y="186" class="mono kick" fill="#25bcdd">MAKER</text>
    <text x="654" y="208" class="sans ut">makes the page</text>
  </g>
  <g class="s b6">
    <line x1="790" y1="186" x2="814" y2="186" class="wire" marker-end="url(#arrow)"/>
    <rect x="818" y="166" width="150" height="56" rx="12" class="unit"/>
    <text x="832" y="186" class="mono kick" fill="#3fbf8a">CHECKER</text>
    <text x="832" y="208" class="sans ut">did not make it</text>
  </g>
  <g class="s b14">
    <path d="M893 222C893 248 715 248 715 226" fill="none" stroke="#3fbf8a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="804" y="258" class="mono lbl" text-anchor="middle">its fixes go back to a maker</text>
  </g>

  <!-- what comes back -->
  <rect x="640" y="276" width="506" height="88" rx="14" fill="none" stroke="#26385a" stroke-width="1.3" stroke-dasharray="6 6"/>
  <text x="656" y="298" class="mono" font-size="13" fill="#a3b3ca">objects/</text>
  <text x="1130" y="298" class="mono lbl" text-anchor="end">each unit hands back objects</text>
  <g class="s b3"><rect x="656" y="312" width="104" height="36" rx="8" class="chip"/><rect x="656" y="312" width="4" height="36" rx="2" fill="#3fbf8a"/><text x="670" y="335" class="mono chipt">decision</text></g>
  <g class="s b12"><rect x="770" y="312" width="118" height="36" rx="8" class="chip"/><rect x="770" y="312" width="4" height="36" rx="2" fill="#6b97ff"/><text x="784" y="335" class="mono chipt">want, as said</text></g>
  <g class="s b13"><rect x="898" y="312" width="70" height="36" rx="8" class="chip"/><rect x="898" y="312" width="4" height="36" rx="2" fill="#25bcdd"/><text x="912" y="335" class="mono chipt">task</text></g>
  <g class="s b15"><rect x="978" y="312" width="152" height="36" rx="8" class="chip"/><rect x="978" y="312" width="4" height="36" rx="2" fill="#25bcdd"/><text x="992" y="335" class="mono chipt">page, checked</text></g>

  <!-- the same file -->
  <rect x="360" y="388" width="786" height="36" rx="10" fill="#0b1a33" stroke="#25bcdd" stroke-opacity=".6" stroke-width="1.2"/>
  <text x="378" y="411" class="mono" font-size="13" fill="#7fd3ff">AGENTS.md</text>
  <text x="470" y="411" class="sans" font-size="13.5" fill="#a3b3ca">read first by every unit; what differs is the role its brief gives it</text>
  <text x="60" y="450" class="mono" font-size="11" fill="#5d7090">what goes out still waits for the person's yes</text>
</svg>
