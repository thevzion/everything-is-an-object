<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Everything is an object</title>
  <desc id="d">A folder named objects holds what was said, decided and made, each one a small file with a header: a problem, a goal, a decision, a local type, a deliverable, and the history of every change. A person, an agent and an app all read and write the same objects.</desc>
  <defs>
    <style>
      .sans{font-family:Saira,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
      .card{fill:#0a1426;stroke:#1d2c47;stroke-width:1.2}
      .kick{font-size:11px;letter-spacing:1.6px;font-weight:500}
      .key{font-size:13px;fill:#8195b3}
      .meta{font-size:12px;fill:#8195b3}
      .body{font-size:15px;fill:#eaf1fb}
      .link{stroke:#3a5280;stroke-width:1.6;fill:none}
      .tiny{font-size:10px;fill:#8195b3}
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d1a30" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="440" cy="230" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#25bcdd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a5280"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#25bcdd"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#060d1a"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="24" fill="url(#glow)"/>

  <!-- the folder -->
  <rect x="48" y="56" width="784" height="354" rx="18" fill="none" stroke="#26385a" stroke-width="1.4" stroke-dasharray="6 6"/>
  <text x="72" y="88" class="mono" font-size="15" fill="#a3b3ca">objects/</text>

  <!-- links -->
  <line x1="334" y1="172" x2="294" y2="172" class="link" marker-end="url(#arrow)"/>
  <text x="313" y="164" class="mono tiny" text-anchor="middle">serves</text>
  <line x1="592" y1="172" x2="552" y2="172" class="link" marker-end="url(#arrow)"/>
  <text x="571" y="164" class="mono tiny" text-anchor="middle">serves</text>
  <line x1="442" y1="262" x2="442" y2="238" class="link" marker-end="url(#arrow)"/>
  <line x1="184" y1="262" x2="184" y2="238" class="link" marker-end="url(#arrow)"/>

  <!-- problem -->
  <rect x="76" y="108" width="216" height="128" rx="12" class="card"/>
  <circle cx="92" cy="128" r="4" fill="#a3b3ca"/>
  <text x="104" y="132" class="mono kick" fill="#a3b3ca">SAID</text>
  <text x="92" y="156" class="mono key">type: <tspan fill="#a3b3ca">problem</tspan></text>
  <text x="92" y="176" class="mono meta">source: from-me</text>
  <text x="92" y="204" class="sans body">Bikes wait three weeks</text>
  <text x="92" y="224" class="sans body">for a repair.</text>

  <!-- goal -->
  <rect x="334" y="108" width="216" height="128" rx="12" class="card"/>
  <circle cx="350" cy="128" r="4" fill="#6b97ff"/>
  <text x="362" y="132" class="mono kick" fill="#6b97ff">SAID</text>
  <text x="350" y="156" class="mono key">type: <tspan fill="#6b97ff">goal</tspan></text>
  <text x="350" y="176" class="mono meta">serves: problem.md</text>
  <text x="350" y="204" class="sans body">Fifty repairs a month</text>
  <text x="350" y="224" class="sans body">by June.</text>

  <!-- decision -->
  <rect x="592" y="108" width="216" height="128" rx="12" class="card"/>
  <circle cx="608" cy="128" r="4" fill="#3fbf8a"/>
  <text x="620" y="132" class="mono kick" fill="#3fbf8a">DECIDED</text>
  <text x="608" y="156" class="mono key">type: <tspan fill="#3fbf8a">decision</tspan></text>
  <text x="608" y="176" class="mono meta">serves: goals/fifty.md</text>
  <text x="608" y="204" class="sans body">Open on Saturdays,</text>
  <text x="608" y="224" class="sans body">from March.</text>

  <!-- a local type -->
  <rect x="76" y="262" width="216" height="128" rx="12" class="card"/>
  <circle cx="92" cy="282" r="4" fill="#e58fc0"/>
  <text x="104" y="286" class="mono kick" fill="#e58fc0">A LOCAL TYPE</text>
  <text x="92" y="310" class="mono key">type: <tspan fill="#e58fc0">supplier</tspan></text>
  <text x="92" y="330" class="mono meta">model: local</text>
  <text x="92" y="358" class="sans body">Who sells us parts?</text>
  <text x="92" y="378" class="sans body">Velo Parts, in Lyon.</text>

  <!-- a deliverable -->
  <rect x="334" y="262" width="216" height="128" rx="12" class="card"/>
  <circle cx="350" cy="282" r="4" fill="#25bcdd"/>
  <text x="362" y="286" class="mono kick" fill="#25bcdd">MADE</text>
  <text x="350" y="310" class="mono key">type: <tspan fill="#25bcdd">deliverable</tspan></text>
  <text x="350" y="330" class="mono meta">lifecycle: review</text>
  <text x="350" y="358" class="sans body">The landing page,</text>
  <text x="350" y="378" class="sans body">index.html beside it.</text>

  <!-- history -->
  <rect x="592" y="262" width="216" height="128" rx="12" class="card"/>
  <circle cx="608" cy="282" r="4" fill="#e3b341"/>
  <text x="620" y="286" class="mono kick" fill="#e3b341">HISTORY</text>
  <line x1="612" y1="306" x2="612" y2="358" stroke="#26385a" stroke-width="1.4"/>
  <circle cx="612" cy="306" r="3.5" fill="#6b97ff"/>
  <circle cx="612" cy="332" r="3.5" fill="#3fbf8a"/>
  <circle cx="612" cy="358" r="3.5" fill="#25bcdd"/>
  <text x="624" y="310" class="mono" font-size="11" fill="#a3b3ca">goal(add): fifty a month</text>
  <text x="624" y="336" class="mono" font-size="11" fill="#a3b3ca">decision(add): Saturdays</text>
  <text x="624" y="362" class="mono" font-size="11" fill="#a3b3ca">deliverable(add): landing</text>
  <text x="608" y="382" class="mono" font-size="10" fill="#8195b3">each with Why: and Source:</text>

  <!-- who reads it -->
  <text x="908" y="104" class="mono" font-size="11" fill="#8195b3">all read the same objects</text>
  <line x1="836" y1="152" x2="902" y2="152" stroke="#2f6fe0" stroke-width="1.6" marker-start="url(#arrowb)" marker-end="url(#arrowb)"/>
  <line x1="836" y1="234" x2="902" y2="234" stroke="#2f6fe0" stroke-width="1.6" marker-start="url(#arrowb)" marker-end="url(#arrowb)"/>
  <line x1="836" y1="316" x2="902" y2="316" stroke="#2f6fe0" stroke-width="1.6" marker-start="url(#arrowb)" marker-end="url(#arrowb)"/>

  <circle cx="930" cy="152" r="22" fill="#0a1426" stroke="#2563eb" stroke-width="1.4"/>
  <circle cx="930" cy="145" r="6" fill="none" stroke="#eaf1fb" stroke-width="1.6"/>
  <path d="M919 163c2-7 20-7 22 0" fill="none" stroke="#eaf1fb" stroke-width="1.6" stroke-linecap="round"/>
  <text x="966" y="150" class="sans" font-size="17" fill="#eaf1fb">A person</text>
  <text x="966" y="169" class="mono" font-size="11" fill="#8195b3">says what they want, and yes</text>

  <circle cx="930" cy="234" r="22" fill="#0a1426" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M930 222v24M918 234h24M921.5 225.5l17 17M938.5 225.5l-17 17" stroke="#eaf1fb" stroke-width="1.6" stroke-linecap="round"/>
  <text x="966" y="232" class="sans" font-size="17" fill="#eaf1fb">An agent</text>
  <text x="966" y="251" class="mono" font-size="11" fill="#8195b3">any provider, reads AGENTS.md</text>

  <circle cx="930" cy="316" r="22" fill="#0a1426" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="918" y="306" width="24" height="20" rx="3" fill="none" stroke="#eaf1fb" stroke-width="1.6"/>
  <line x1="918" y1="312" x2="942" y2="312" stroke="#eaf1fb" stroke-width="1.6"/>
  <text x="966" y="314" class="sans" font-size="17" fill="#eaf1fb">An app</text>
  <text x="966" y="333" class="mono" font-size="11" fill="#8195b3">any app, built on the objects</text>

  <text x="48" y="440" class="mono" font-size="12" fill="#8195b3">TheVZion · Convention 0.3, draft</text>
  <text x="1152" y="440" class="mono" font-size="12" fill="#5d7090" text-anchor="end">one object per question</text>
</svg>
